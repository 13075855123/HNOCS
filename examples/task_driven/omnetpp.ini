# ====================================================================
# Test: ONoCMesh + XYOPCalc + optical bypass (bypass ReconfigurableOPCalc bug)
# ====================================================================

[ONoCXYOptical]
network = hnocs.onoc.topologies.ONoCMesh
sim-time-limit = 20ms
**.rows    = 4
**.columns = 4
**.routerType  = "hnocs.routers.hier.Router"
**.portType    = "hnocs.routers.hier.Port"
**.inPortType  = "hnocs.routers.hier.inPort.InPortSync"
**.OPCalcType  = "hnocs.routers.hier.opCalc.static.XYOPCalc"
**.VCCalcType  = "hnocs.routers.hier.vcCalc.free.FLUVCCalc"
**.schedType   = "hnocs.routers.hier.sched.wormhole.SchedSync"
**.coreType    = "hnocs.cores.task.TaskPE"
**.numVCs=4
**.flitSize=16B
**.statStartTime=1us
**.csvFile="tasks_mpeg4_static.csv"
**.bufferBaseId=1000
**.enableSetupHandshake=true
**.enableOpticalBypass=true
**.globalBuffer.enableOpticalBypass=true
**.pe[*].setupRetryDelay=50ns
**.pe[*].setupPendingTimeout=2us
**.pe[*].opticalRequiredWavelengths=2
**.pe[*].opticalWavelengthBitrate=256Gbps
**.pe[*].opticalBasePropagationDelay=0.5ns
**.pe[*].opticalPerHopDelay=0.1ns
**.pe[*].opticalBurstSize=1
**.pe[*].enableEnergyWindow=false
**.pe[*].enablePowerTrace=false
**.defaultOpticalWavelengths=2
**.maxOpticalWavelengths=16
**.numOpticalSpatialChannels=2
**.inPort.flitsPerVC=4
**.inPort.enableEnergyWindow=false
**.sched.arbitration_type=0
**.sched.freeRunningClk=false
**.RconvPE=8
**.RconvRouter=10
**.RlateralPE=15
**.RlateralRouter=15
**.Rpe2router=3
**.Cpe=1e-6
**.Crouter=2e-7
**.Tambient=318.15
**.Tthrottle=320.0
**.throttleBeta=0.05
# Temperature-aware optical effects
**.opticalEnableThermalEffects=true
**.opticalTambient_K=318.15
**.opticalThermoOpticCoeff_nm_per_K=0.1
**.opticalTuningEfficiency_mW_per_nm=0.5
result-dir=results

