[General]
network = hnocs.topologies.TaskMesh
sim-time-limit = 20ms
record-eventlog = false
**.vector-recording = true
**.cmdenv-log-level = error

**.rows    = 4
**.columns = 4

# Router sub-module types
**.coreType = "hnocs.cores.task.TaskPE"
**.routerType  = "hnocs.routers.hier.Router"
**.portType    = "hnocs.routers.hier.Port"
**.inPortType  = "hnocs.routers.hier.inPort.InPortSync"
**.OPCalcType  = "hnocs.routers.hier.opCalc.static.XYOPCalc"
**.VCCalcType  = "hnocs.routers.hier.vcCalc.free.FLUVCCalc"
**.schedType   = "hnocs.routers.hier.sched.wormhole.SchedSync"

# GlobalBuffer
**.bufferBaseId = 1000
# ===== Task Graph Selection =====

**.csvFile = "tasks_mpeg4_static.csv"


# Global NoC parameters
**.numVCs        = 4
**.flitSize      = 16B
**.statStartTime = 1us

#能耗开关
**.pe[*].enableEnergyWindow = true
**.pe[*].enablePowerTrace    = true
**.pe[*].powerTraceFile      = "power_trace.csv"

# Power model - PE
**.pe[*].powerIdle        = 0.5W
**.pe[*].powerCompute     = 2.0W
**.pe[*].powerSendPerFlit = 1e-10J
**.pe[*].powerRecvPerFlit = 5e-11J
**.pe[*].energyWindow = 100ns



# Compute density: derive computeTime from data size (0=use CSV)
**.pe[*].computeDensity = 0

# InPort
**.inPort.flitsPerVC        = 4
**.inPort.collectPerHopWait = false
**.inPort.energyWindow = 100ns
**.inPort.enableEnergyWindow = true
**.inPort.eBufferWrite = 1e-12J
**.inPort.eBufferRead  = 1e-12J
**.inPort.eCrossbar    = 0.5e-12J
**.inPort.pLeak        = 1e-3W

# Scheduler
**.sched.arbitration_type = 0
**.sched.freeRunningClk   = false
**.heterogeneous          = false
**.givenTclk              = false
**.tClk                   = 1ns

# ===== RC Thermal Model =====
# Silicon die: 148 W/(m·K), 712 J/(kg·K), 2330 kg/m³
# 4×4 mesh, 10×10mm die → each tile 2.5×2.5mm, die thickness 0.5mm
# Cpe ≈ ρ·c·A·h = 2330 × 712 × (2.5e-3)² × 0.5e-3 ≈ 5.2e-6 J/K  (use 1e-6 as calibration)
# Rlateral ≈ pitch/(k·A_cross) = 2.5e-3 / (148 × 2.5e-3 × 0.5e-3) ≈ 13.5 K/W
# Vertical stack: R_TIM ≈ 0.5 K/W, R_spreader ≈ 1 K/W, R_sink ≈ 5 K/W → ~6.5 K/W
**.RconvPE        = 8
**.RconvRouter    = 10
**.RlateralPE     = 15
**.RlateralRouter = 15
**.Rpe2router     = 3
**.Cpe            = 1e-6
**.Crouter        = 2e-7
**.Tambient       = 318.15

# DVFS thermal throttling: T > 47°C → compute slows down 5%/°C above
**.Tthrottle      = 320.0
**.throttleBeta   = 0.05

result-dir = results

# ====================================================================
# ONoC — full optical-electrical hybrid with ReconfigurableOPCalc
# ====================================================================

[ONoCGeneral]
network = hnocs.onoc.topologies.ONoCMesh
sim-time-limit = 20ms
record-eventlog = false
**.vector-recording = true
**.cmdenv-log-level = error

**.rows    = 4
**.columns = 4

# Router sub-module types
**.routerType  = "hnocs.routers.hier.Router"
**.portType    = "hnocs.routers.hier.Port"
**.inPortType  = "hnocs.routers.hier.inPort.InPortSync"
**.OPCalcType  = "hnocs.onoc.routing.ReconfigurableOPCalc"
**.coreType    = "hnocs.cores.task.TaskPE"
**.VCCalcType  = "hnocs.routers.hier.vcCalc.free.FLUVCCalc"
**.schedType   = "hnocs.routers.hier.sched.wormhole.SchedSync"

# Global NoC parameters
**.numVCs        = 4
**.flitSize      = 16B
**.statStartTime = 1us

# ===== Task Graph (fixed mapping) =====
**.csvFile = "tasks_mpeg4_static.csv"
**.bufferBaseId = 1000

# ===== TaskPE power model =====
**.pe[*].enableEnergyWindow = true
**.pe[*].enablePowerTrace    = true
**.pe[*].powerTraceFile      = "power_trace.csv"
**.pe[*].powerIdle        = 0.5W
**.pe[*].powerCompute     = 2.0W
**.pe[*].powerSendPerFlit = 1e-10J
**.pe[*].powerRecvPerFlit = 5e-11J
**.pe[*].energyWindow = 100ns
**.pe[*].computeDensity = 0

# ===== Optical handshake + bypass =====
**.initialTopology = "mesh"
**.physicalTopology = "mesh"
**.enableSetupHandshake = true
**.enableOpticalBypass = true
**.pe[*].setupRetryDelay = 50ns
**.pe[*].setupPendingTimeout = 200ns
**.pe[*].opticalRequiredWavelengths = 2
**.pe[*].opticalWavelengthBitrate = 256Gbps
**.pe[*].opticalBasePropagationDelay = 0.5ns
**.pe[*].opticalPerHopDelay = 0.1ns
**.pe[*].opticalBurstSize = 1

# ===== Optical layer =====
**.opticalEnableThermalEffects = false
**.opticalWavelengthStrategy = "lowest"
**.defaultOpticalWavelengths = 2
**.maxOpticalWavelengths = 8
**.numOpticalSpatialChannels = 2
**.opticalLaunchPower_dBm = 0.0
**.opticalReceiverSensitivity_dBm = -18.0
**.opticalSourceModulatorLoss_dB = 2.0
**.opticalHopInsertionLoss_dB = 0.5
**.opticalHopCrosstalkLoss_dB = 0.1
**.opticalReceiverDemodulatorLoss_dB = 2.0

# ===== InPort energy =====
**.inPort.flitsPerVC        = 4
**.inPort.collectPerHopWait = false
**.inPort.energyWindow = 100ns
**.inPort.enableEnergyWindow = true
**.inPort.eBufferWrite = 1e-12J
**.inPort.eBufferRead  = 1e-12J
**.inPort.eCrossbar    = 0.5e-12J
**.inPort.pLeak        = 1e-3W

# ===== RC Thermal model =====
**.RconvPE        = 8
**.RconvRouter    = 10
**.RlateralPE     = 15
**.RlateralRouter = 15
**.Rpe2router     = 3
**.Cpe            = 1e-6
**.Crouter        = 2e-7
**.Tambient       = 318.15
**.Tthrottle      = 320.0
**.throttleBeta   = 0.05

**.sched.arbitration_type = 0
**.sched.freeRunningClk   = false

result-dir = results

# ====================================================================
# Per-task-graph configs — extend ONoCGeneral, override only csvFile
# ====================================================================

[ONoC_MPEG4]
extends = ONoCGeneral
**.csvFile = "tasks_mpeg4_static.csv"

[ONoC_GEMM]
extends = ONoCGeneral
**.csvFile = "tasks_gemm_static.csv"

[ONoC_VOPD]
extends = ONoCGeneral
**.csvFile = "tasks_vopd_static.csv"

[ONoC_Optic]
extends = ONoCGeneral
**.csvFile = "optic_static.csv"
