# ====================================================================
# ONoC — full optical-electrical hybrid with ReconfigurableOPCalc
# ====================================================================

[ONoCGeneral]
network = hnocs.onoc.topologies.ONoCMesh
sim-time-limit = 20ms
record-eventlog = false
# Keep .vec focused on paper metrics: the evaluator only needs PE temperature
# time series for T_max, sigma_T, and N_hot. Scalars remain recorded in .sca.
**.pe[*].pe-die-temperature.vector-recording = true
**.vector-recording = false
**.vector-record-empty = false
**.cmdenv-log-level = off

**.rows    = 4
**.columns = 4

# Router sub-module types
**.routerType  = "hnocs.routers.hier.Router"
**.portType    = "hnocs.routers.hier.Port"
**.inPortType  = "hnocs.routers.hier.inPort.InPortSync"
**.OPCalcType  = "hnocs.onoc.routing.ReconfigurableOPCalc"
**.coreType    = "hnocs.cores.task.TaskPE"
**.VCCalcType  = "hnocs.routers.hier.vcCalc.free.FLUVCCalc"
**.schedType   = "hnocs.routers.hier.sched.wormhole.SchedSync"

# Global NoC parameters
**.numVCs        = 4
**.flitSize      = 16B
**.statStartTime = 100ns

**.bufferBaseId = 1000

# ===== TaskPE power model =====
**.pe[*].enableEnergyWindow = true
**.pe[*].enablePowerTrace    = false
**.pe[*].powerIdle        = 0.3W
**.pe[*].powerCompute     = 2.5W
**.pe[*].powerSendPerFlit = 2e-10J
**.pe[*].powerRecvPerFlit = 1e-10J
**.pe[*].opticalModulatorEnergyPerFlit = 25e-12J
**.pe[*].opticalReceiverEnergyPerFlit  = 15e-12J
**.pe[*].energyWindow = 100ns
**.pe[*].computeDensity = 0

# ===== Optical handshake + bypass =====
**.initialTopology = "mesh"
**.physicalTopology = "mesh"
**.enableSetupHandshake = true
**.enableOpticalBypass = true
**.pe[*].setupRetryDelay = 50ns
**.pe[*].setupPendingTimeout = 2us
**.pe[*].opticalRequiredWavelengths = 2
**.pe[*].opticalWavelengthBitrate = 256Gbps
**.pe[*].opticalBasePropagationDelay = 0.5ns
**.pe[*].opticalPerHopDelay = 0.1ns
**.availableOpticalWavelengths = 8

# ===== Optical layer =====
**.opticalEnableThermalEffects = true
**.opticalTambient_K = 318.15
**.opticalThermoOpticCoeff_nm_per_K = 0.10
**.opticalTuningEfficiency_mW_per_nm = 0.50
**.opticalRingIL_TempCoeff_dB_per_K = 0.02
**.opticalSoaGain_TempCoeff_dB_per_K = 0.05
**.opticalWaveguideLoss_TempCoeff_dB_per_cm_per_K = 0.001
**.opticalRingTuningPower_mW_per_ring = 0.0
**.opticalNumRingsPerRouter = 160
**.opticalWavelengthStrategy = "lowest"
**.opticalCentreWavelengthsNm = "1544.53,1546.12,1547.72,1549.32,1550.92,1552.52,1554.13,1555.75"
**.defaultOpticalWavelengths = 2
**.maxOpticalWavelengths = 8
**.numOpticalSpatialChannels = 2
**.opticalLaunchPower_dBm = 0.0
**.opticalReceiverSensitivity_dBm = -12.0
**.opticalSourceModulatorLoss_dB = 2.0
**.opticalHopInsertionLoss_dB = 0.5
**.opticalHopCrosstalkLoss_dB = 0.1
**.opticalReceiverDemodulatorLoss_dB = 2.0
**.opticalSoaPumpPower_mW = 80.0
**.opticalLaserWPE = 0.20

# ===== InPort energy =====
**.inPort.flitsPerVC        = 4
**.inPort.collectPerHopWait = false
**.inPort.energyWindow = 100ns
**.inPort.enableEnergyWindow = true
**.inPort.eBufferWrite = 1e-12J
**.inPort.eBufferRead  = 1e-12J
**.inPort.eCrossbar    = 0.5e-12J
**.inPort.pLeak        = 1e-3W

# ===== RC Thermal model =====
**.RconvPE        = 8
**.RconvRouter    = 10
**.RlateralPE     = 10
**.RlateralRouter = 10
**.Rpe2router     = 3
**.Cpe            = 1e-6
**.Crouter        = 1e-7
**.Tambient       = 318.15
**.Tthrottle      = 327.15
**.throttleBeta   = 0.1

**.sched.arbitration_type = 0
**.sched.freeRunningClk   = false
**.heterogeneous          = false
**.givenTclk              = false
**.tClk                   = 1ns

result-dir = results

# ====================================================================
# Per-task-graph configs — extend ONoCGeneral, override only csvFile
# ====================================================================

# ── Static (fixed) mappings ──
[ONoC_MPEG4]
extends = ONoCGeneral
**.csvFile = "static/tasks_mpeg4_static.csv"

[ONoC_GEMM]
extends = ONoCGeneral
**.csvFile = "static/tasks_gemm_static.csv"

[ONoC_VOPD]
extends = ONoCGeneral
**.csvFile = "static/tasks_vopd_static.csv"

[ONoC_Optic]
extends = ONoCGeneral
**.csvFile = "static/optic_static.csv"

[ONoC_HNN]
extends = ONoCGeneral
sim-time-limit = 200ms
**.csvFile = "static/tasks_hnn_static.csv"

# ── B-2 GA remapped mappings ──
[ONoC_MPEG4_B2]
extends = ONoCGeneral
**.csvFile = "mapping/tasks_mpeg4_b2.csv"

[ONoC_GEMM_B2]
extends = ONoCGeneral
**.csvFile = "mapping/tasks_gemm_b2.csv"

[ONoC_VOPD_B2]
extends = ONoCGeneral
**.csvFile = "mapping/tasks_vopd_b2.csv"

[ONoC_Optic_B2]
extends = ONoCGeneral
**.csvFile = "mapping/tasks_optic_b2.csv"

[ONoC_HNN_B2]
extends = ONoCGeneral
sim-time-limit = 200ms
**.csvFile = "mapping/tasks_hnn_b2.csv"

# ── Trace-driven ──
[ONoC_ElecInput]
extends = ONoCGeneral
**.csvFile = "static/2_trace_elec_input_tasks(1).csv"
