# Benchmark comparison: OMNeT++ vs Python thermal simulator
# Usage: opp_run_dbg ... omnetpp_bench.ini -u Cmdenv -c GEMM

[General]
network = hnocs.topologies.TaskMesh
sim-time-limit = 20ms
record-eventlog = false
**.vector-recording = false
**.cmdenv-log-level = error
**.rows    = 4
**.columns = 4

# Router sub-module types
**.coreType = "hnocs.cores.task.TaskPE"
**.routerType  = "hnocs.routers.hier.Router"
**.portType    = "hnocs.routers.hier.Port"
**.inPortType  = "hnocs.routers.hier.inPort.InPortSync"
**.OPCalcType  = "hnocs.routers.hier.opCalc.static.XYOPCalc"
**.VCCalcType  = "hnocs.routers.hier.vcCalc.free.FLUVCCalc"
**.schedType   = "hnocs.routers.hier.sched.wormhole.SchedSync"

**.bufferBaseId = 1000
**.wTemperature   = 1.0
**.wHopCount      = 0.5
**.remapToDynamic = false

# NoC parameters
**.numVCs        = 4
**.flitSize      = 16B
**.statStartTime = 1us

# Power (disabled for pure timing comparison)
**.pe[*].enableEnergyWindow = false
**.pe[*].enablePowerTrace    = false
**.pe[*].computeDensity = 0

# InPort
**.inPort.flitsPerVC        = 4
**.inPort.collectPerHopWait = false
**.inPort.energyWindow = 100ns
**.inPort.enableEnergyWindow = false

# Scheduler
**.sched.arbitration_type = 0
**.sched.freeRunningClk   = false
**.heterogeneous          = false
**.givenTclk              = false
**.tClk                   = 1ns

# Thermal (disabled for pure timing)
**.enableEnergyWindow = false
**.enablePowerTrace   = false

result-dir = results

# ============================================================
[GEMM]
**.csvFile = "gemm_static.csv"

[MPEG4]
**.csvFile = "mpeg4_static.csv"

[VOPD]
**.csvFile = "vopd_static.csv"

[Optic]
**.csvFile = "optic_static.csv"
